name: Release Extension

'on':
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: chrome-web-store-release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      release_tag: ${{ github.ref_name }}

  submit:
    needs: verify
    if: vars.CWS_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          path: release
          merge-multiple: true
          digest-mismatch: error
      - name: Check publisher setup before authentication
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CWS_PUBLISH_ENABLED: ${{ vars.CWS_PUBLISH_ENABLED }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
          EXPECTED_SHA256: ${{ needs.verify.outputs.sha256 }}
        run: node scripts/submit-release.mjs --preflight
      - name: Authenticate with a short-lived publisher token
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CWS_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 600s
          create_credentials_file: false
          export_environment_variables: false
      - name: Upload and submit for review
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          CWS_PUBLISH_ENABLED: ${{ vars.CWS_PUBLISH_ENABLED }}
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_EXTENSION_ID: ${{ vars.CWS_EXTENSION_ID }}
          CWS_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
          CWS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          EXPECTED_SHA256: ${{ needs.verify.outputs.sha256 }}
        run: node scripts/submit-release.mjs --submit
